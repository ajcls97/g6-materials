<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>G6 ESL Teaching Materials</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <h1>G6 ESL <span>Teaching Materials</span></h1>
      <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
      </nav>
    </div>
  </header>

  <main>
    <h2 class="page-title">Grade 6 Language Arts</h2>
    <p class="page-subtitle">Kid's Box 6 — Click a unit to browse materials</p>

    <div class="unit-grid" id="unitGrid">
      <!-- Unit cards generated by JS -->
    </div>
  </main>

  <footer>
    &copy; 2026 Alex Stewart — Changshu Lunhua Foreign Language School
  </footer>

  <script src="js/main.js"></script>
  <script>
    // Embedded unit data for immediate rendering (works offline, no server needed)
    const EMBEDDED_DATA = {
      units: {
        U0: { topic: "Introduction", language: "Getting started, classroom language" },
        U1: { topic: "Beastly Tales", language: "Going to future, animals, plays" },
        U2: { topic: "The Future", language: "Predictions with will/wont, transport" },
        U3: { topic: "The Great Outdoors", language: "Past continuous, countryside, adventure" },
        U4: { topic: "Food & Recipes", language: "How much/how many, cooking" },
        U5: { topic: "Under the Sea", language: "Sea creatures, present perfect" },
        U6: { topic: "Free Time", language: "Quantifiers, hobbies" },
        U7: { topic: "Dress Sense", language: "Clothes, may/might, describing" },
        U8: { topic: "Around the World", language: "Countries, present perfect just/yet/already" }
      },
      // File counts per unit (from materials scan)
      fileCounts: {
        U0: { total: 2, breakdown: "2 quizzes" },
        U1: { total: 43, breakdown: "17 lessons, 22 worksheets, 3 quizzes, 1 review" },
        U2: { total: 46, breakdown: "22 lessons, 23 worksheets, 1 review" },
        U3: { total: 18, breakdown: "9 lessons, 5 worksheets, 2 quizzes, 2 audio" },
        U4: { total: 7, breakdown: "4 lessons, 3 worksheets" },
        U5: { total: 42, breakdown: "17 lessons, 25 worksheets" },
        U6: { total: 42, breakdown: "11 lessons, 14 worksheets, 8 quizzes, 8 audio, 1 review" },
        U7: { total: 34, breakdown: "11 lessons, 16 worksheets, 5 quizzes, 2 audio" },
        U8: { total: 20, breakdown: "10 lessons, 7 worksheets, 3 reviews" }
      }
    };

    // Render unit cards immediately
    const UNIT_COLORS = {
      U0: '#7f8c8d', U1: '#2980b9', U2: '#148f77', U3: '#d35400',
      U4: '#c0392b', U5: '#1a5276', U6: '#27ae60', U7: '#8e44ad', U8: '#e67e22'
    };

    const grid = document.getElementById('unitGrid');
    for (const [unitId, info] of Object.entries(EMBEDDED_DATA.units)) {
      const counts = EMBEDDED_DATA.fileCounts[unitId] || { total: 0, breakdown: '' };
      const color = UNIT_COLORS[unitId] || '#2980b9';

      const card = document.createElement('a');
      card.href = `unit.html?unit=${unitId}`;
      card.className = 'unit-card';
      card.style.setProperty('--card-color', color);
      card.innerHTML = `
        <div class="unit-number" style="color:${color}">${unitId}</div>
        <div class="unit-topic">${info.topic}</div>
        <div class="unit-language">${info.language}</div>
        <div class="file-count">
          <span>📁 ${counts.total} files</span>
          ${counts.breakdown ? `<span>• ${counts.breakdown}</span>` : ''}
        </div>
      `;
      grid.appendChild(card);
    }
  </script>
</body>
</html>
